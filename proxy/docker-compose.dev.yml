services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oauth3
      POSTGRES_USER: oauth3
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  proxy:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://oauth3:dev@postgres:5432/oauth3
      CORS_ORIGIN: "*"
      PORT: 3000
      DB_PATH: /data/proxy.db
    volumes:
      - proxydata:/data
    depends_on:
      - postgres

volumes:
  pgdata:
  proxydata:
